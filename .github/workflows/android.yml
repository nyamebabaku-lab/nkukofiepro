name: Build Android apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apks:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      - name: Restore signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.p12
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> $GITHUB_ENV

      # One build per app: customers, farm (owners/managers/workers), admin (super admin).
      - name: Build the three apps
        run: |
          for APP in main farm admin; do
            case $APP in main) DIR=android; OUT=NkukoFiePro ;; farm) DIR=android-farm; OUT=NkukoFiePro-Farm ;; admin) DIR=android-admin; OUT=NkukoFiePro-Admin ;; esac
            VITE_APP=$APP OUT_DIR=build/$APP npx vite build
            APP=$APP npx cap sync android
            (cd $DIR && chmod +x gradlew && ./gradlew --no-daemon assembleRelease bundleRelease)
            cp $DIR/app/build/outputs/apk/release/app-release.apk $OUT.apk
            cp $DIR/app/build/outputs/bundle/release/app-release.aab $OUT.aab
          done

      - name: Publish release (download links always point to the newest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v2.0.${{ github.run_number }}"
          gh release create "$TAG" NkukoFiePro.apk NkukoFiePro-Farm.apk NkukoFiePro-Admin.apk NkukoFiePro.aab NkukoFiePro-Farm.aab NkukoFiePro-Admin.aab \
            --title "Nkukɔ Fie Pro Android 2.0.${{ github.run_number }}" \
            --notes "NkukoFiePro.apk — customers. NkukoFiePro-Farm.apk — farm owners, managers and workers. NkukoFiePro-Admin.apk — platform super admin. Allow 'Install unknown apps' when asked. The .aab files are for the Google Play Store." \
            --latest
