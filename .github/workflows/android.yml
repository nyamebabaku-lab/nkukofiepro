name: Build Android apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apks:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      - name: Restore signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.p12
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> $GITHUB_ENV

      - name: PoultryPro (customers, workers, managers)
        run: |
          VITE_APP=main OUT_DIR=build/main npx vite build
          APP=main npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../PoultryPro.apk
          cp app/build/outputs/bundle/release/app-release.aab ../PoultryPro.aab

      - name: PoultryPro Admin (owners, super admin)
        run: |
          VITE_APP=admin OUT_DIR=build/admin npx vite build
          APP=admin npx cap sync android
          cd android-admin && chmod +x gradlew && ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../PoultryPro-Admin.apk
          cp app/build/outputs/bundle/release/app-release.aab ../PoultryPro-Admin.aab

      - name: Publish release (download links always point to the newest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.0.${{ github.run_number }}"
          gh release create "$TAG" PoultryPro.apk PoultryPro-Admin.apk PoultryPro.aab PoultryPro-Admin.aab \
            --title "PoultryPro Android 1.0.${{ github.run_number }}" \
            --notes "PoultryPro.apk — customers, farm workers and managers. PoultryPro-Admin.apk — farm owners and the platform admin. Allow 'Install unknown apps' when asked. The .aab files are for the Google Play Store." \
            --latest
